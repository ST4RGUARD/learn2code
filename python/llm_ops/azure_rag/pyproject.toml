[project]
name = "azure-rag"
version = "0.1.0"
requires-python = ">=3.13.2"
dependencies = [
    "azure-identity>=1.25.3",
    "azure-search-documents>=12.0.0",
    "fastapi>=0.139.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "langchain>=1.3.11",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.3.3",
    "langchain-qdrant>=1.1.0",
    "openai>=2.44.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.0",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "ipython",
    "ipython-icat",
    "Pillow",
]
